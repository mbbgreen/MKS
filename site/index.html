<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreEdge Status &amp; Telemetry</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #f8fafc; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .status {
      margin-top: 20px;
      padding: 12px 16px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .badge {
      color: #4ade80;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CoreEdge Gateway</h1>
    <p>Automated edge health and API telemetry endpoint. All public web routes are operating normally.</p>
    <div class="status">
      <span>API Gateway</span>
      <span class="badge">Operational</span>
    </div>
    <div class="status">
      <span>Edge Routing</span>
      <span class="badge">99.98% Uptime</span>
    </div>
  </div>
</body>
</html>
